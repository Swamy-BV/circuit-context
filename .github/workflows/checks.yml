name: checks

on: [push, pull_request]

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[mcp,dev]"
      - run: python -m ruff check .
      - run: python -m mypy
      - run: python examples/scripts/pcb_knowledge.py
      - run: python -m build
