[project]
name = "circuit-context"
version = "0.1.0"
description = "Source-backed hardware engineering guidance with offline retrieval and MCP"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["pydantic>=2.7,<3"]

[project.optional-dependencies]
mcp = ["fastmcp>=4.0.0,<5"]
ingest = ["pymupdf>=1.24"]
search = ["fastembed==0.7.4"]
dev = ["ruff>=0.9", "mypy>=1.13", "build>=1.2"]

[project.scripts]
circuit-context = "circuit_context.__main__:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/circuit_context"]

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "D", "RUF"]
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.10"
files = ["src"]
strict = true
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = ["fastembed.*", "huggingface_hub.*", "tokenizers.*"]
ignore_missing_imports = true
follow_imports = "silent"
